name: CI Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Rectangle.app
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Code-sign Rectangle.app
        run: |
          chmod +x build_rectangle.sh
          ./build_rectangle.sh --skip-install
          codesign --verify --deep --strict Rectangle.app
          ls -lh dist/
