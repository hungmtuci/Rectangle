name: Build & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag phiên bản cần phát hành (ví dụ: v2.1.1-custom)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build macOS Release (.zip)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version metadata from tag
        id: meta
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"

      - name: Build & Package Rectangle.app
        env:
          RECTANGLE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x build_rectangle.sh
          ./build_rectangle.sh --skip-install
          ls -lh dist/

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.raw_tag }}
          name: "Rectangle v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/Rectangle-v${{ steps.meta.outputs.version }}-macOS.zip
            dist/Rectangle.zip
